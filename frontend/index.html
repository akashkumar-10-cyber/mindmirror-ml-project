<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMirror AI – Emotion-Aware Action Recommendation System</title>
  <meta name="description" content="Machine Learning innovation system combining Transformer emotion analysis, intensity estimation, situational context extraction, and personalized next-step recommendations.">
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100 selection:bg-teal-500 selection:text-slate-950">

  <!-- TOP NAVIGATION BAR -->
  <header class="sticky top-0 z-50 bg-slate-950/95 border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="#home" class="flex items-center gap-3.5 shrink-0 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-indigo-600 flex items-center justify-center shadow-md shadow-teal-500/20 group-hover:scale-105 transition-all">
          <i data-lucide="sparkles" class="w-5 h-5 text-slate-950"></i>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <span class="font-display font-extrabold text-lg text-white tracking-tight">MindMirror<span class="text-teal-400"> AI</span></span>
            <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md bg-teal-950/80 text-teal-400 border border-teal-800/50">ML</span>
          </div>
          <span class="text-[11px] text-slate-400 font-medium">Emotion-Aware Action Engine</span>
        </div>
      </a>

      <!-- Center Navigation Links -->
      <nav class="hidden md:flex items-center gap-1.5 p-1 rounded-xl bg-slate-900 border border-slate-800">
        <a href="#home" class="nav-link px-4 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all" data-view="home">
          Home
        </a>
        <a href="#analyze" class="nav-link px-4 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all" data-view="analyze">
          Analyze & Act
        </a>
        <a href="#dashboard" class="nav-link px-4 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all" data-view="dashboard">
          Dashboard
        </a>
        <a href="#history" class="nav-link px-4 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all" data-view="history">
          History
        </a>
        <a href="#how-it-works" class="nav-link px-4 py-2 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition-all" data-view="how-it-works">
          How It Works
        </a>
      </nav>

      <!-- Right Actions & ML Status -->
      <div class="flex items-center gap-3 shrink-0">
        <div id="system-status-pill" class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
          <span id="model-badge-text" class="font-mono text-[11px]">DistilRoBERTa ML</span>
        </div>

        <a href="#analyze" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-teal-400 hover:bg-teal-300 text-slate-950 shadow-md shadow-teal-400/20 transition-all hover:scale-105">
          <i data-lucide="zap" class="w-3.5 h-3.5 fill-slate-950"></i>
          <span>Try Analysis</span>
        </a>
      </div>

    </div>
  </header>

  <!-- MAIN VIEW CONTAINER -->
  <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <!-- Views injected by app.js -->
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-800 bg-slate-950 py-8 mt-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-check" class="w-4 h-4 text-teal-400 shrink-0"></i>
        <span><strong>MindMirror AI</strong> – Machine Learning Innovation Wellness & Decision Support Prototype. Non-diagnostic.</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="#how-it-works" class="hover:text-teal-400 transition-colors">Architecture</a>
        <a href="#safety-privacy" class="hover:text-teal-400 transition-colors">Safety & Privacy</a>
      </div>
    </div>
  </footer>

  <!-- Crisis Modal -->
  <div id="crisis-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-rose-500/40 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center gap-3 text-rose-400">
        <i data-lucide="life-buoy" class="w-7 h-7"></i>
        <h3 class="text-base font-bold font-display text-white">Supportive Resources</h3>
      </div>
      <p id="crisis-modal-text" class="text-xs text-slate-300 leading-relaxed whitespace-pre-line"></p>
      <div class="flex justify-end pt-2">
        <button onclick="document.getElementById('crisis-modal').classList.add('hidden')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200">
          Close Notice
        </button>
      </div>
    </div>
  </div>

  <!-- History Detail Pop-up Modal -->
  <div id="history-detail-modal" class="fixed inset-0 z-50 hidden bg-slate-950/90 flex items-center justify-center p-3 sm:p-6 overflow-y-auto" onclick="if(event.target === this) app.closeHistoryModal()">
    <div id="history-modal-content" class="bg-slate-900 border border-slate-700/90 rounded-3xl max-w-2xl w-full p-5 sm:p-7 shadow-2xl space-y-6 animate-modal-pop my-auto max-h-[90vh] overflow-y-auto relative overscroll-contain">
      <!-- Injected by app.js / components.js -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/state.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
